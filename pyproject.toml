[project]
name = "clawditor"
version = "0.1.0"
description = "Static + active-probe security audit pipeline for Android APKs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",          # CLI
    "rich>=13.7",           # console output, tables, syntax highlighting
    "httpx>=0.27",          # active-probe HTTP client
]

[project.scripts]
clawditor = "clawditor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clawditor"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
